const $ = id => document.getElementById(id);
const F = [$('f0'), $('f1'), $('f2'), $('f3'), $('f4'), $('f5'), $('f6')];
const W = F.map(f => f.parentElement);
const LAST = F.length - 1;
const S = F.map(() => ({ chapters: [], beats: 0, beat: -1, busy: false, ended: false, rewinding: false }));
let cur = 0, switching = false;

document.querySelectorAll('.slide.scene').forEach(w => {
  const c = $('chrome').content.firstElementChild.cloneNode(true);
  c.querySelector('h2').textContent = w.dataset.title;
  c.addEventListener('click', e => { const r = c.getBoundingClientRect(); ((e.clientX - r.left) / r.width < 0.3 ? backward : forward)(); });
  w.prepend(c);
});

const send = (i, msg) => {
  if (msg.cmd === 'rewind' || msg.cmd === 'play') { S[i].rewinding = true; asleep[i] = false; }
  F[i].contentWindow.postMessage(Object.assign({ cop31: true }, msg), '*');
};

let incoming = -1;
const asleep = F.map(() => false);
const LIGHT = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;
const loaded = F.map(() => false);
const arrived = F.map(() => null);
function load(i) {
  if (loaded[i]) return Promise.resolve();
  loaded[i] = true;
  asleep[i] = false;
  Object.assign(S[i], { beat: -1, busy: false, ended: false, rewinding: false });
  return new Promise(res => {
    arrived[i] = res;
    setTimeout(res, 12000);
    F[i].src = F[i].dataset.src;
  });
}
function unload(i) {
  if (!LIGHT || !loaded[i] || i === cur || i === incoming) return;
  loaded[i] = false;
  F[i].src = 'about:blank';
  Object.assign(S[i], { beat: -1, busy: false, ended: i === LAST, rewinding: false });
}
const sleep = i => { if (!asleep[i]) { asleep[i] = true; send(i, { cmd: 'sleep' }); } };
const wake = i => { asleep[i] = false; send(i, { cmd: 'wake' }); };
function ready(j, ms) {
  return new Promise(res => {
    const t0 = performance.now();
    const check = () => (!S[j].rewinding && performance.now() - t0 > 120) || performance.now() - t0 > ms ? res() : setTimeout(check, 40);
    check();
  });
}
async function switchTo(j, prep) {
  if (switching || j === cur) return;
  switching = true;
  incoming = j;
  render();
  await load(j);
  const from = W[cur], to = W[j], fromIdx = cur;
  const hadFocus = document.activeElement === F[fromIdx];
  wake(j);
  from.style.zIndex = 2; to.style.zIndex = 1;
  to.classList.add('on');
  if (prep) prep();
  await ready(j, 4000);
  await new Promise(r => setTimeout(r, prep ? 360 : 120));
  cur = j;
  render();
  if (hadFocus) F[j].focus();
  dissolve = from.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1400, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
  if (hurry) dissolve.updatePlaybackRate(5);
  await dissolve.finished;
  dissolve = null;
  hurry = false;
  from.classList.remove('on');
  from.getAnimations().forEach(a => a.cancel());
  from.style.zIndex = to.style.zIndex = '';
  sleep(fromIdx);
  incoming = -1;
  switching = false;
  unload(fromIdx);
  render();
}
const atStart = i => S[i].beat < 0 && !S[i].busy;

let dissolve = null, hurry = false;
function hurrySwitch() {
  hurry = true;

}
const forward = () => { if (switching) hurrySwitch(); else if (!atEnd()) send(cur, { cmd: 'key', key: 'ArrowRight' }); };
const backward = () => { if (switching) hurrySwitch(); else if (!atBegin()) send(cur, { cmd: 'key', key: 'ArrowLeft' }); };
const atBegin = () => cur === 0 && atStart(0);
const atEnd = () => cur === LAST && S[LAST].ended;

function goStation(j) {
  if (j === cur) { send(j, { cmd: 'rewind', to: -1 }); return; }
  switchTo(j, () => { if (!atStart(j)) send(j, { cmd: 'rewind', to: -1 }); });
}
function goBead(j, k) {
  const from = S[j].chapters[k];
  if (j === cur) { send(j, { cmd: 'play', from }); return; }
  switchTo(j, () => send(j, { cmd: 'play', from }));
}
function restartAll() {
  const rewindAll = () => F.forEach((f, i) => { if (!atStart(i)) send(i, { cmd: 'rewind', to: -1 }); });
  if (cur === 0) rewindAll(); else switchTo(0, rewindAll);
}

function render() {
  const line = $('line');
  if (!line.children.length) {
    S.forEach((s, j) => {
      if (j) { const g = document.createElement('i'); g.className = 'seg long'; line.appendChild(g); }
      const st = document.createElement('i');
      st.className = 'st'; st.innerHTML = ICONS[j]; st.dataset.scene = j;
      st.addEventListener('click', () => goStation(j));
      line.appendChild(st);
      s.chapters.forEach((_, k) => {
        const g = document.createElement('i'); g.className = 'seg'; line.appendChild(g);
        const b = document.createElement('i');
        b.className = 'bd'; b.dataset.scene = j; b.dataset.k = k;
        b.addEventListener('click', () => goBead(j, k));
        line.appendChild(b);
      });
    });
  }
  const kids = [...line.children];
  kids.forEach(el => {
    const j = +el.dataset.scene, s = S[j];
    if (el.classList.contains('st')) {
      const opening = s.beat < 0 || s.beat < s.chapters[0];
      el.className = 'st ' + (j < cur ? 'done' : j > cur ? '' : opening ? 'cur' : 'done');
    } else if (el.classList.contains('bd')) {
      const k = +el.dataset.k;
      const now = s.chapters.reduce((a, b, i) => (s.beat >= b ? i : a), -1);
      el.className = 'bd ' + (j < cur ? 'done' : j > cur ? '' : k < now ? 'done' : k === now ? 'cur' : '');
    }
  });
  kids.forEach(el => {
    if (el.classList.contains('seg')) el.classList.toggle('done', /\b(done|cur)\b/.test(el.nextElementSibling.className));
  });
  $('b-prev').disabled = atBegin();
  $('b-next').disabled = atEnd();
}

addEventListener('message', e => {
  const i = F.findIndex(f => f.contentWindow === e.source);
  const m = e.data || {};
  if (i < 0 || !m.cop31) return;
  const hidden = i !== cur && i !== incoming;
  if (m.type === 'meta') {
    S[i].chapters = m.chapters; S[i].beats = m.beats; $('line').innerHTML = ''; render(); if (hidden) sleep(i);
    if (arrived[i]) { arrived[i](); arrived[i] = null; }
  }
  else if (m.type === 'state') {
    Object.assign(S[i], { beat: m.beat, busy: m.busy, ended: m.ended, rewinding: !!m.rewinding });
    render();
    if (hidden && !m.rewinding) sleep(i);
  }
  else if ((m.type === 'next' || m.type === 'prev') && switching) hurrySwitch();
  else if (m.type === 'next' && i === cur && cur < LAST) {
    switchTo(cur + 1, () => { if (!atStart(cur + 1)) send(cur + 1, { cmd: 'rewind', to: -1 }); });
  } else if (m.type === 'prev' && i === cur && cur > 0) {
    const j = cur - 1;
    switchTo(j, () => { if (!S[j].ended) send(j, { cmd: 'rewind', to: S[j].beats - 1 }); });
  } else if (m.type === 'key' && i === cur) pageKey(m.key);
});

const body = document.body;
function setNav(open) {
  body.classList.toggle('closed', !open);
  try { localStorage.setItem('cop31-nav', open ? 'open' : 'closed'); } catch (err) { }
  fit();
}
try { if (localStorage.getItem('cop31-nav') === 'closed') body.classList.add('closed'); } catch (err) { }
$('b-fold').addEventListener('click', () => setNav(false));
$('tab-open').addEventListener('click', () => setNav(true));
$('b-prev').addEventListener('click', backward);
$('b-next').addEventListener('click', forward);
$('b-restart').addEventListener('click', restartAll);

const CAN_FULL = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!CAN_FULL) $('b-full').style.display = 'none';
function toggleFull() {
  if (!CAN_FULL) return;
  const d = document, el = d.documentElement;
  const r = (d.fullscreenElement || d.webkitFullscreenElement)
    ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)
    : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
}
function fullIcon() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  body.classList.toggle('full', on);
  clearTimeout(peekTimer); body.classList.remove('peek');
  $('full-icon').setAttribute('d', on ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
  $('b-full').setAttribute('aria-label', on ? 'Tam ekrandan çık' : 'Tam ekran');
  fit();
}
$('b-full').addEventListener('click', toggleFull);

let peekTimer = 0;
const peek = on => {
  clearTimeout(peekTimer);
  if (on) body.classList.add('peek');
  else peekTimer = setTimeout(() => body.classList.remove('peek'), 1200);
};
const nav = $('nav');
$('hot').addEventListener('mouseenter', () => peek(true));
$('hot').addEventListener('mouseleave', () => peek(false));
nav.addEventListener('mouseenter', () => { if (body.classList.contains('full')) peek(true); });
nav.addEventListener('mouseleave', () => { if (body.classList.contains('full')) peek(false); });
$('hot').addEventListener('click', e => {
  if (e.pointerType === 'touch') { body.classList.toggle('peek'); return; }
  if (e.clientX / innerWidth < 0.3) backward(); else forward();
});
document.addEventListener('fullscreenchange', fullIcon);
document.addEventListener('webkitfullscreenchange', fullIcon);

function pageKey(key) {
  if (key === 'f' || key === 'F') { toggleFull(); return true; }
  if (key === 'n' || key === 'N') {
    if (body.classList.contains('full')) { clearTimeout(peekTimer); body.classList.toggle('peek'); }
    else setNav(body.classList.contains('closed'));
    return true;
  }
  return false;
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (pageKey(e.key)) { e.preventDefault(); return; }
  const k = e.key;
  if (['ArrowRight', ' ', 'Enter', 'PageDown'].includes(k)) { e.preventDefault(); forward(); }
  else if (['ArrowLeft', 'Backspace', 'PageUp'].includes(k)) { e.preventDefault(); backward(); }
  else if (['1', '2', '3', '4'].includes(k)) { e.preventDefault(); if (!switching) send(cur, { cmd: 'key', key: k }); }
});
let touchFrom = null;
addEventListener('touchstart', e => { touchFrom = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
addEventListener('touchend', e => {
  if (!touchFrom || e.touches.length) return;
  const dx = e.changedTouches[0].clientX - touchFrom.x, dy = e.changedTouches[0].clientY - touchFrom.y;
  touchFrom = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) dispatchEvent(new KeyboardEvent('keydown', { key: dx < 0 ? 'ArrowRight' : 'ArrowLeft' }));
}, { passive: true });

const WIN = { top: 104, h: 900 };
function fit() {
  const full = body.classList.contains('full'), closed = body.classList.contains('closed');
  const pad = full ? 0 : 12, strip = full ? 0 : closed ? 24 : 58;
  const aw = innerWidth - 2 * pad, ah = innerHeight - pad - strip;
  const s = Math.max(0.05, Math.min(aw / 1920, ah / 1080));
  const w = Math.round(1920 * s), h = Math.round(1080 * s);
  Object.assign($('frame').style, { left: Math.round((innerWidth - w) / 2) + 'px', top: Math.round(pad + (ah - h) / 2) + 'px', width: w + 'px', height: h + 'px' });
  const k = w / 1920;
  document.querySelectorAll('.chrome').forEach(c => { c.style.transform = `scale(${k})`; });
  const wh = Math.round(WIN.h * k), ww = Math.round(wh * 16 / 9);
  document.querySelectorAll('.slide.scene > iframe').forEach(f => Object.assign(f.style, {
    left: Math.round((w - ww) / 2) + 'px', top: Math.round(WIN.top * k) + 'px', width: ww + 'px', height: wh + 'px' }));
}
fit(); addEventListener('resize', fit);
render();
F[0].addEventListener('load', () => F[0].focus());
F.forEach((f, i) => { if (!LIGHT || i === 0) load(i); });
</script>
</body>
