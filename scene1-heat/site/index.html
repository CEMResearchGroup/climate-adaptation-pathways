<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate Adaptation Pathways in the Built Environment · 1 Heat stress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%23FFB300'%3E%3Ccircle cx='32' cy='32' r='15'/%3E%3Cpath d='M32 2l4 11h-8zM32 62l-4-11h8zM2 32l11-4v8zM62 32l-11 4v-8zM10.8 10.8l10.6 5-5.6 5.6zM53.2 53.2l-10.6-5 5.6-5.6zM10.8 53.2l5-10.6 5.6 5.6zM53.2 10.8l-5 10.6-5.6-5.6z'/%3E%3C/g%3E%3C/svg%3E">
<style>:root {
  --ink: #1F2633;
  --panel: rgba(17, 25, 48, .9);
  --yellow: #F5B70A;
  --orange: #F26B1D;
  --red: #E53935;
  --green: #2FBF71;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0B1020; overflow: hidden; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
#viewport { position: fixed; inset: 0; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #fff; cursor: pointer; }
#shake, #world { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#world { transform-origin: 0 0; }
.layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#L-night { clip-path: inset(0 0 0 100%); }
#L-fx { pointer-events: none; }
.actor { position: absolute; transform-origin: 50% 100%; }   /* no blanket will-change: ~100 full-size layers per scene
   ran the graphics memory out (flicker); the engine promotes only big actors that animate continuously */
.actor .inner, .actor .flipper { position: relative; width: 100%; height: 100%; }
.actor .flipper.flip { transform: scaleX(-1); }
.actor svg { display: block; }
/* the crane's hoist ropes above a lowered hook (story.js A.cable): the two ropes of machinery/crane-load (x 64 and 76,
   2 px, #222B3A) continued from the trolley down to the hook block, so they never break off when the hook goes down */
.cable { position: absolute; width: 14px; box-sizing: border-box; border-left: 2px solid #222B3A; border-right: 2px solid #222B3A; pointer-events: none; }
.night-tint { filter: brightness(.86) saturate(.9); }
.night-plant { filter: brightness(.62) saturate(.85) hue-rotate(8deg); }

#divider { position: absolute; top: 0; left: 1920px; width: 6px; height: 1080px; margin-left: -3px; opacity: 0;
  background: linear-gradient(#fff0, #fff 15%, #FFE9A8 50%, #fff 85%, #fff0);
  box-shadow: 0 0 30px 10px rgba(255, 233, 168, .55); pointer-events: none; }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 180px rgba(10, 16, 40, .28); }
.warm-sky { position: absolute; left: 0; top: 0; width: 1920px; height: 760px; opacity: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 158, 84, .55), rgba(255, 196, 120, .35) 55%, rgba(255, 220, 160, 0)); }
.haze { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 32% 12%, rgba(255, 196, 60, .35), rgba(255, 170, 60, .12) 40%, rgba(255, 140, 40, 0) 70%); mix-blend-mode: multiply; }

/* icons */
.ico { display: inline-block; vertical-align: middle; }
.ico svg { width: 100%; height: 100%; display: block; }

/* in-scene fx */
.fx { position: absolute; pointer-events: none; }
.puff { border-radius: 50%; }
.coolflake { width: 26px; height: 26px; }
.coolflake svg { width: 100%; height: 100%; }

/* HUD */
#hud { position: absolute; left: 36px; top: 30px; display: flex; gap: 18px; align-items: center; padding: 18px 28px 18px 18px;
  background: rgba(255, 255, 255, .94); color: var(--ink); border-radius: 26px; box-shadow: 0 14px 40px rgba(20, 30, 60, .25);
  transform: translateX(-130%); opacity: 0; }
.hud-row { display: flex; gap: 22px; align-items: baseline; }
.hud-row2 { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
#hud-time { font-size: 64px; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
#hud-temp { font-size: 48px; font-weight: 900; color: var(--red); font-variant-numeric: tabular-nums; }
.hud-ico { width: 62px; height: 62px; }
.hud-ico.sm { width: 40px; height: 40px; margin-right: 6px; }
.hud-range { display: inline-flex; align-items: center; font-size: 26px; font-weight: 900; color: #5B6577; background: #F1F3F7; border-radius: 999px; padding: 6px 18px 6px 10px; }

/* sliding banner */
#banner { position: absolute; left: 0; top: 300px; width: 1920px; pointer-events: none; }
.banner-inner { display: inline-flex; align-items: center; gap: 22px; transform: translateX(-110%); padding: 16px 60px 16px 40px;
  font-size: 52px; font-weight: 900; color: #fff; background: linear-gradient(90deg, #C62828, #E53935 40%, #F26B1D);
  box-shadow: 0 12px 40px rgba(120, 20, 10, .35); border-radius: 0 999px 999px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.banner-inner.ok { background: linear-gradient(90deg, #138A5B, #2FBF71 50%, #14A89B); box-shadow: 0 12px 40px rgba(10, 90, 60, .35); }
.banner-inner .tile { width: 92px; height: 92px; background: #fff; border-radius: 24px; padding: 8px; }
.banner-inner .tile .ico { width: 100%; height: 100%; }
.banner-inner .sep { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .6); }

/* the left 30 % of the screen goes one step back (only the cursor hints it) */
#stage.in-back { cursor: w-resize; }

/* progress + controls */
#progress { position: absolute; bottom: 52px; left: 40px; display: flex; gap: 12px; padding: 12px 16px; background: rgba(17, 25, 48, .55); border-radius: 999px; }
#progress i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, .35); transition: background .4s, transform .4s; }
#progress i.done { background: rgba(255, 255, 255, .85); }
#progress i.cur { background: var(--yellow); transform: scale(1.3); }
#controls { position: absolute; top: 22px; right: 26px; display: flex; gap: 12px; }
#controls button { width: 58px; height: 58px; border-radius: 50%; border: 0; background: rgba(17, 25, 48, .6); color: #fff; cursor: pointer; display: grid; place-items: center; }
#controls button:hover { background: rgba(17, 25, 48, .85); }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* video export (?render) */
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 20; }
.render #controls, .render #progress, .embed #controls, .embed #progress { display: none; }
.render #stage { cursor: none; }

</style>
</head>

<div id="viewport">
  <div id="stage">
    <div id="shake">
      <div id="world">
        <div class="layer" id="L-day"></div>
        <div class="layer" id="L-night"></div>
        <div id="divider"></div>
        <div class="layer" id="L-fx"></div>
      </div>
    </div>
    <div id="vignette"></div>

    <!-- HUD: thermometer + clock (numbers and pictograms only) -->
    <div id="hud" aria-hidden="true">
      <svg id="thermo" viewBox="0 0 60 200" width="54" height="180">
        <rect x="21" y="8" width="18" height="150" rx="9" fill="#EDF1F5" stroke="#C9D2DC" stroke-width="3"/>
        <g stroke="#9AA6B4" stroke-width="2" stroke-linecap="round">
          <line x1="42" y1="30" x2="50" y2="30"/><line x1="42" y1="55" x2="48" y2="55"/><line x1="42" y1="80" x2="50" y2="80"/>
          <line x1="42" y1="105" x2="48" y2="105"/><line x1="42" y1="130" x2="50" y2="130"/>

        <rect id="mercury" x="25" y="30" width="10" height="135" rx="5" fill="#E53935"/>
        <circle id="bulb" cx="30" cy="172" r="20" fill="#E53935" stroke="#C9D2DC" stroke-width="3"/>
        <circle cx="24" cy="166" r="5" fill="#fff" opacity=".45"/>
      </svg>
      <div class="hud-body">
        <div class="hud-row"><span id="hud-time">12:00</span><span id="hud-temp">42°C</span></div>
        <div class="hud-row2"><span id="hud-status" class="hud-ico"></span><span class="hud-range"><span id="hud-sun" class="hud-ico sm"></span>12:00–16:00</span></div>
      </div>
    </div>

    <div id="banner" aria-hidden="true"><div class="banner-inner"></div></div>


    <div id="progress" aria-hidden="true"></div>
    <div id="controls">
      <button id="btn-restart" aria-label="↻">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 12a8 8 0 1 0 2.4-5.7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M4 3v5h5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="fade"></div>
  </div>
</div>

<script>/* ==========================================================================
   Virtual clock for frame-by-frame video export (index.html?render).
   Inactive in normal use. When active, timers, requestAnimationFrame,
   performance.now and every Web Animation only move when VCLOCK.advance(ms)
   is called, so each exported frame is exact (no dropped or stuttering frames).
   ========================================================================== */
const VCLOCK = (() => {
  if (!new URLSearchParams(location.search).has('render')) return null;

  let now = 0, seq = 0;
  const timers = new Map();          // id -> { t, fn, args, every, id }
  const rafs = new Map();
  const anims = new Set();

  const ms = v => Math.max(0, +v || 0);
  window.setTimeout = (fn, delay, ...args) => { const id = ++seq; timers.set(id, { t: now + ms(delay), fn, args, id }); return id; };
  window.setInterval = (fn, delay, ...args) => { const id = ++seq; const e = Math.max(1, ms(delay)); timers.set(id, { t: now + e, fn, args, every: e, id }); return id; };
  window.clearTimeout = window.clearInterval = id => { timers.delete(id); };
  window.requestAnimationFrame = fn => { const id = ++seq; rafs.set(id, fn); return id; };
  window.cancelAnimationFrame = id => { rafs.delete(id); };
  Object.defineProperty(performance, 'now', { value: () => now, configurable: true });

  // every WAAPI animation is created paused and then driven by hand
  const animate = Element.prototype.animate;
  Element.prototype.animate = function (frames, opts) {
    const a = animate.call(this, frames, opts);
    a.pause();
    a.currentTime = 0;
    a.__t0 = now;
    a.__end = a.effect.getComputedTiming().endTime;   // Infinity for endless loops
    anims.add(a);
    return a;
  };

  function sync() {
    for (const a of anims) {
      if (a.playState === 'idle' || a.playState === 'finished') { anims.delete(a); continue; }   // cancelled / done
      const local = now - a.__t0;
      if (local >= a.__end) { anims.delete(a); a.finish(); }
      else a.currentTime = local;
    }
  }
  // a real macrotask: lets every pending promise chain run before we continue
  const flush = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });

  async function advance(dt) {
    const target = now + dt;
    for (let guard = 0; guard < 5000; guard++) {
      let next = null;
      for (const tm of timers.values()) if (!next || tm.t < next.t || (tm.t === next.t && tm.id < next.id)) next = tm;
      let animEnd = Infinity;
      for (const a of anims) animEnd = Math.min(animEnd, a.__t0 + a.__end);
      const t = Math.min(next ? next.t : Infinity, animEnd);
      if (t > target) break;
      now = Math.max(now, t);
      sync();
      if (next && next.t <= now) {
        if (next.every) next.t += next.every; else timers.delete(next.id);
        try { next.fn(...next.args); } catch (e) { console.error(e); }
      }
      await flush();
    }
    now = target;
    sync(); await flush();
    const cbs = [...rafs.values()]; rafs.clear();
    cbs.forEach(fn => { try { fn(now); } catch (e) { console.error(e); } });
    sync(); await flush();
  }

  return { advance, now: () => now };
})();

/* ==========================================================================
   COP31 — tiny animation engine
   Actors are inlined SVGs from the library (ASSETS map, injected at build time).
   Each mount re-prefixes ids so the same asset can appear many times.
   ========================================================================== */

const W = 1920, H = 1080;
let SPEED = 1;                 // < 1 = fast-forward (rewind / debug jump), one-shot tweens & waits only
const D = ms => Math.max(1, ms * SPEED);
/* Generation: bumped when the scene is rebuilt (going back). Chains from an older generation simply stop
   at their next wait/tween (the promise never settles), so they can't touch the new scene. */
let GEN = 0;
const NEVER = new Promise(() => {});
const wait = ms => { const g = GEN; return new Promise(r => setTimeout(() => { if (g === GEN) r(); }, D(ms))); };
const later = (fn, ms) => { const g = GEN; setTimeout(() => { if (g === GEN) fn(); }, D(ms)); };
const $ = (s, el = document) => el.querySelector(s);

const EASE = {
  inOut: 'cubic-bezier(.65,0,.35,1)',
  out: 'cubic-bezier(.22,1,.36,1)',
  in: 'cubic-bezier(.55,0,1,.45)',
  back: 'cubic-bezier(.34,1.56,.64,1)',
  drop: 'cubic-bezier(.3,1.35,.55,1)',
  lin: 'linear',

/* Tween CSS props of an element from what is on screen right now (computed style, so a running
   animation's current value counts), then commit the end values inline. */

  const cs = getComputedStyle(el);
  const from = {};
  for (const k of Object.keys(to)) {
    const cssName = k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
    from[k] = (el.isConnected && cs.getPropertyValue(cssName)) || el.style[k] || '';
  }
  const a = el.animate([from, to], { duration: D(dur), easing, delay: D(delay), fill: 'forwards' });
  const g = GEN;
  return a.finished.then(() => { if (g !== GEN) return NEVER; Object.assign(el.style, to); a.cancel(); })
    .catch(() => (g === GEN ? undefined : NEVER));
}

/* Infinite (or long) loops run in real time even while fast-forwarding. */
function loopAnim(el, frames, opts) {
  return el.animate(frames, Object.assign({ iterations: Infinity, easing: 'ease-in-out' }, opts));
}

const T = (x1, y1, x2, y2) => [{ transform: `translate(${x1}px,${y1}px)` }, { transform: `translate(${x2}px,${y2}px)` }];

let UID = 0;
function inlineSVG(name, prefix) {
  const src = ASSETS[name];
  if (!src) throw new Error('missing asset ' + name);
  return src
    .replace(/<title>[\s\S]*?<\/title>/g, '')          // the library's names would show as tooltips: the scenes stay wordless
    .replace(/\sid="/g, ` id="${prefix}`)
    .replace(/url\(#/g, `url(#${prefix}`)

}

/* Performance: an inline SVG puts every one of its shapes into the page, and the browser re-layers ALL of them on every
   frame in which anything animates inside an SVG. So an actor starts as a plain <img> of its SVG (one picture, drawn
   once) and only becomes inline the first time its parts are needed (part(), parts(), pivot(), .svg) — i.e. only
   the actors that are actually animated or changed piece by piece. Static scenery stays a picture. */
const SVG_URLS = {};

  return SVG_URLS[name];
}

class Actor {
  /** name: 'people/worker-walking'; opts: {w,h,flip,cls,before,o,layer,inline} */
  constructor(layer, name, x, y, opts = {}) {
    this.name = name;
    this.slug = name.split('/').pop();
    this.pre = 'a' + (++UID) + '_';
    this.x = x; this.y = y;
    this.st = { dx: 0, dy: 0, s: 1, r: 0 };
    this.loops = {};

    const src = ASSETS[name];
    if (!src) throw new Error('missing asset ' + name);
    const vb = /viewBox="([^"]+)"/.exec(src)[1].split(/[\s,]+/).map(Number);
    this.vw = vb[2]; this.vh = vb[3];
    this.w = opts.w || this.vw; this.h = opts.h || this.vh;

    const el = document.createElement('div');
    el.className = 'actor ' + (opts.cls || '');
    el.innerHTML = `<div class="inner"><div class="flipper${opts.flip ? ' flip' : ''}"></div></div>`;
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: this.w + 'px', height: this.h + 'px' });
    if (opts.o !== undefined) el.style.opacity = opts.o;
    if (opts.z !== undefined) el.style.zIndex = opts.z;
    this.el = el; this.inner = el.firstElementChild; this.flipper = this.inner.firstElementChild;
    this._svg = null; this._img = null;

    else {

      img.decoding = 'sync'; img.alt = ''; img.draggable = false;
      img.style.cssText = 'display:block;width:100%;height:100%';
      img.src = svgURL(name);
      this.flipper.appendChild(img);
      this._img = img;
    }
    const ref = opts.before && (opts.before.el || opts.before);
    if (ref && ref.parentNode === layer) layer.insertBefore(el, ref); else layer.appendChild(el);
  }
  /** the inline SVG (made on first use) */
  get svg() { return this._svg || this.makeInline(); }
  makeInline() {
    if (this._svg) return this._svg;
    this.flipper.insertAdjacentHTML('afterbegin', inlineSVG(this.name, this.pre));
    const svg = this.flipper.querySelector(':scope > svg');
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    svg.setAttribute('overflow', 'visible');
    svg.style.overflow = 'visible';

      g.style.transformOrigin = `${px}px ${py}px`;

  set(o) { Object.assign(this.st, pick(o, 'dx', 'dy', 's', 'r')); this.el.style.transform = this.tf(); if (o.o !== undefined) this.el.style.opacity = o.o; return this; }

    if (o.y !== undefined) o.dy = o.y - this.y;

    if (el !== this.inner && el !== this.el && !this.el.style.willChange) {

const Camera = {

  str(v) { const s = W / v.w; return `scale(${s}) translate(${-v.x}px, ${-v.y}px)`; },

/* ------------------------------------------------------------ walking */
/** Swap a posed worker for a walking one, walk to (x,y) [top-left of the 120×180 walker], resolve with the walker. */
function walkCycle(walker, period = 700) {
  const o = { duration: period, direction: 'alternate', easing: 'ease-in-out' };
  walker.loop('legN', 'leg-near', R(0, -32), o);
  walker.loop('legF', 'leg-far', R(0, 32), o);
  walker.loop('shinN', 'shin-near', [{ transform: 'rotate(18deg)' }, { transform: 'rotate(0deg)' }, { transform: 'rotate(6deg)' }], o);
  walker.loop('shinF', 'shin-far', [{ transform: 'rotate(0deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(18deg)' }], o);
  walker.loop('armN', 'arm-near', R(0, 38), o);
  walker.loop('armF', 'arm-far', R(0, -38), o);
  walker.loop('bob', '@inner', T(0, 0, 0, -3), { duration: period / 2, direction: 'alternate', easing: 'ease-in-out' });

async function walk(walker, x, y, speed = 110) {
  const dist = Math.hypot(x - (walker.x + walker.st.dx), y - (walker.y + walker.st.dy));
  walkCycle(walker);
  await walker.to({ x, y }, (dist / speed) * 1000, EASE.lin);
  walker.stopAll();
  return walker;
}

function fxEl(layer, html, x, y, cls = '') {

   The project's index.html plays the scenes back to back, each in an iframe opened with ?embed. An embedded
   scene hides its own buttons and progress, reports its state to the page and takes commands from it. */
const EMBED = new URLSearchParams(location.search).has('embed') && window.parent !== window;
function embedPost(msg) { if (EMBED) window.parent.postMessage(Object.assign({ cop31: true }, msg), '*'); }
/* A scene that is not on screen sleeps: the page pauses all its animations (so it costs nothing) and wakes it before
   showing it again. 'sleep' may come again at any time (e.g. after a rewind made new animations): it re-pauses. */
let ASLEEP = false;
const isRewinding = () => typeof rewinding !== 'undefined' && rewinding;   // story.js flag: never freeze a rewind half-way
const pauseAll = () => document.getAnimations().forEach(a => { if (a.playState === 'running') a.pause(); });
if (EMBED) {
  addEventListener('message', e => {
    const m = e.data || {};
    if (!m.cop31) return;
    if (m.cmd === 'sleep') { ASLEEP = true; if (!isRewinding()) pauseAll(); }
    else if (m.cmd === 'wake') { ASLEEP = false; document.getAnimations().forEach(a => { if (a.playState === 'paused') a.play(); }); }
  });
  // animations that start while asleep (a delayed walker, the end of a rewind) are caught and paused too
  setInterval(() => { if (ASLEEP && !isRewinding()) pauseAll(); }, 400);
}

/* HUD */
function hudSet(min, temp) {
  const hh = String(Math.floor(min / 60)).padStart(2, '0'), mm = String(Math.floor(min % 60)).padStart(2, '0');
  $('#hud-time').textContent = `${hh}:${mm}`;
  $('#hud-temp').textContent = `${Math.round(temp)}°C`;
  const top = 140 - (Math.min(45, Math.max(20, temp)) - 20) / 25 * 110;
  const m = $('#mercury'); m.setAttribute('y', top); m.setAttribute('height', 172 - top);
  const hot = Math.min(1, Math.max(0, (temp - 30) / 12));
  const col = `rgb(${Math.round(229 + (245 - 229) * (1 - hot))},${Math.round(57 + (158 - 57) * (1 - hot))},${Math.round(53 + (11 - 53) * (1 - hot))})`;
  m.setAttribute('fill', col); $('#bulb').setAttribute('fill', col); $('#hud-temp').style.color = col;
}
async function banner(parts, ok = false, hold = 3000) {
  const b = $('.banner-inner');
  b.classList.toggle('ok', ok);
  b.innerHTML = parts.map(p => p === '·' ? '<span class="sep"></span>' : p.includes('/') ? `<span class="tile">${icon(p)}</span>` : `<span>${p}</span>`).join('');
  b.style.transform = 'translateX(-110%)';
  await tween(b, { transform: 'translateX(0px)' }, 800, EASE.out);
  await wait(hold);
  await tween(b, { transform: 'translateX(2100px)' }, 900, EASE.in);
  b.style.transform = 'translateX(-110%)';
}
async function timelapse(dur = 7000) {
  const hands = A.sun.clock;
  await tween(hands, { opacity: '1' }, 600, EASE.out);
  const total = D(dur), g = GEN;
  hands.querySelector('.h-min').animate(R(0, 1620), { duration: total, easing: 'ease-in-out', fill: 'forwards' });
  hands.querySelector('.h-hour').animate(R(0, 135), { duration: total, easing: 'ease-in-out', fill: 'forwards' });
  A.sun.to({ x: 470, y: 105, s: .9, filter: 'saturate(1.35) hue-rotate(-18deg) brightness(.97)' }, dur, EASE.inOut);
  tween(A.warm, { opacity: '1' }, dur, EASE.inOut);
  releaseHaze();
  tween(A.haze, { opacity: '0' }, dur);
  A.heat.fadeOut(dur * .6);
  const t0 = performance.now();
  await new Promise(res => {
    const step = now => {
      if (g !== GEN) return;                         // scene was rebuilt (went back)
      const p = Math.min(1, (now - t0) / total);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      hudSet(12 * 60 + e * 270, 42 - e * 9);
      if (p < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  await tween(hands, { opacity: '0' }, 800);
}

/* No words, no pop-ups, no sound: every click plays the next piece of animation.

    point için 1 tıklama gereksin … tek tıklamayla ardı arkasına çalışsın") */
const STEP_PAUSE = 900;
const seq = (...steps) => async () => { for (const [i, f] of steps.entries()) { if (i) await wait(STEP_PAUSE); await f(); } };

const BEATS = [
  /* ---------------- 1 · scorching noon ---------------- */
  { ch: 1, run: async () => { await Camera.to(CAM.dayWorkers, 2000); exhausted(); await wait(1200); } },

  /* ---------------- 2 · night shift: the site splits into night, the neighbours are asleep ---------------- */

        A.zzz.forEach((z, i) => later(() => zzzOn(z), i * 350));   // everyone in the building is asleep
        await wait(1400);

  /* ---------------- 3 · the shift starts, the neighbours wake up ---------------- */
  { ch: 3, run: async () => {
      await startNoise();
      for (let i = 0; i < 3; i++) { await wake(i + 1, A['res' + (i + 1)], () => WAKE[i](A['res' + (i + 1)])); await wait(650); }
    } },

  /* ---------------- 4 · a break in the shade ---------------- */
  { ch: 4, run: seq(() => Camera.to(CAM.daySide, 2200), placeStation, restInShade) },

  /* ---------------- 5 · hottest hours: no work 12:00–16:00, then back to work ---------------- */
  { ch: 5, run: seq(
      async () => {
        await Camera.to(CAM.full, 1600);
        hudSet(12 * 60, 42);
        $('#hud-status').innerHTML = icon(I('no-work'));

        walk(w, -170, 592, 120);
        await wait(2000);
      },
      () => timelapse(7500),

  /* ---------------- 6 · quiet night: automation works, the neighbours sleep ---------------- */
  { ch: 6, run: seq(
      clearNightSite,
      automationArrives,
      async () => { await Promise.all([startPrinting(), sleep(1, A.res1), sleep(2, A.res2), sleep(3, A.res3)]); await wait(1500); }) },

  /* ---------------- 7 · precast modules: made in the factory, set in place in hours — both modules, then the wide
     shot again (the end of the scene) ---------------- */
  { ch: 7, run: seq(
      precastArrives,
      () => liftModule(A.modA, PRE.houseX, PRE.ground - 160),
      async () => { await liftModule(A.modB, PRE.houseX, PRE.ground - 260); await precastDone(); },
      async () => { await Camera.to(CAM.full, 2200); await wait(600); showRestart(); }) },
];

/* ---- precast: the crane hoist (craneL + its hook) and the two modules ---- */
/** move trolley (tx along the jib) and hook (dy below its rest) together; a carried module follows the hook */
function hoistTo(tx, dy, dur, easing = EASE.inOut) {
  const h = A.hoist;
  h.tx = tx; h.dy = dy;
  const jobs = [
    A.craneL.partTo('trolley', { transform: `translateX(${tx}px)` }, dur, easing),
    A.loadL.to({ dx: tx, dy }, dur, easing),
    tween(A.cable, { left: (PRE.load.x + 63 + tx) + 'px', height: Math.max(0, dy) + 'px' }, dur, easing),
  ];
  if (h.cargo) jobs.push(h.cargo.to({ x: PRE.load.x + tx + PRE.hook.x - PRE.ring.x, y: PRE.load.y + dy + PRE.hook.y - PRE.ring.y }, dur, easing));
  return Promise.all(jobs);
}
/** hoist values that put the hook bowl on a module's lifting ring, for a module whose top-left is (x, y) */
const hookAt = (x, y) => [x + PRE.ring.x - PRE.hook.x - PRE.load.x, y + PRE.ring.y - PRE.hook.y - PRE.load.y];
const posOf = a => [a.x + a.st.dx, a.y + a.st.dy];

async function precastArrives() {

  ['trolley', 'swing'].forEach(k => A.loadL.stop(k, 600)); A.craneL.stop('trolley', 600);
  const ex = A.excL;
  ['boom', 'arm', 'bucket'].forEach(k => ex.stop(k, 600));
  const rollers = ['roller-1', 'roller-2', 'roller-3', 'roller-4', 'roller-5', 'roller-6', 'roller-7', 'roller-8', 'roller-9'];
  later(() => { spinWheels(ex, rollers, 700); ex.to({ dx: -720 }, 4200, EASE.in).then(() => stopWheels(ex, rollers)); }, 600);
  await wait(650);
  const slab = (async () => {
    await hoistTo(0, 330, 2200);
    await Promise.all(['slab', 'slings', 'slings-back'].map(n => A.loadL.partTo(n, { opacity: '0' }, 300)));
    await hoistTo(0, 0, 1600);
  })();
  // the flatbed brings two modules, stacked (the ground-floor unit on top, so it comes off first)
  const tr = A.truckP = new Actor(Ld, 'machinery/flatbed-truck', PRE.truck.x, PRE.truck.y, { before: A.fence0 });
  const deck = PRE.truck.y + 58, mx = PRE.truck.x + 14;
  A.modB = new Actor(Ld, 'precast/precast-module-b', mx, deck - 160, { before: A.fence0 });
  A.modA = new Actor(Ld, 'precast/precast-module-a', mx, deck - 260, { before: A.fence0 });
  [A.modA, A.modB].forEach(mo => hidePart(mo, 'rig'));
  const ride = [tr, A.modB, A.modA], tw = wheelsOf(tr);
  ride.forEach(a => a.set({ dx: -900 }));
  spinWheels(tr, tw, 600);
  await wait(900);
  await Promise.all(ride.map(a => a.to({ dx: 0 }, 3600, EASE.out)));
  stopWheels(tr, tw);
  await slab;
}
/** hook on, lift clear, carry over the house, lower into place, unhook */
async function liftModule(mod, toX, toY) {
  const [x, y] = posOf(mod);
  const [tx, dy] = hookAt(x, y);
  await hoistTo(tx, dy, 1500);
  await mod.partTo('rig', { opacity: '1' }, 350);
  A.hoist.cargo = mod;
  const up = Math.max(0, dy - 140);                  // the hook never rises above its rest height
  await hoistTo(tx, up, 1400);
  const [tx2, dy2] = hookAt(toX, toY);
  await hoistTo(tx2, up, 2000);
  await hoistTo(tx2, dy2, 1700, EASE.out);
  A.hoist.cargo = null;
  await mod.partTo('rig', { opacity: '0' }, 350);
  await hoistTo(tx2, Math.max(0, dy2 - 120), 1000);
}
async function precastDone() {
  const tr = A.truckP, tw = wheelsOf(tr);
  hoistTo(0, 0, 2200);
  spinWheels(tr, tw, 600);
  await tr.to({ dx: 900 }, 4200, EASE.in);    // drives off behind the building
  stopWheels(tr, tw);
}

/* ------------------------------------------------------------- runtime */
let beat = -1, busy = false, rewinding = false;
let END = false;                                     // the last beat has played

/** an inlined library SVG wrapped as an icon */
function icon(name, cls = '') {
  return `<span class="ico ${cls}">${inlineSVG(name, 'i' + (++UID) + '_')}</span>`;
}
const FLAKE = '<svg viewBox="0 0 24 24"><g stroke="#BFE6FF" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="22"/><line x1="3.3" y1="7" x2="20.7" y2="17"/><line x1="3.3" y1="17" x2="20.7" y2="7"/></g></svg>';

function setProgress(ch) {
  const pr = $('#progress');
  if (!pr.children.length) for (let i = 0; i < N_CHAPTERS; i++) pr.appendChild(document.createElement('i'));
  [...pr.children].forEach((d, i) => { d.className = i + 1 < ch ? 'done' : i + 1 === ch ? 'cur' : ''; });
}
/** no on-screen arrows: clicks and keys drive the story; an embedding page hears every change */
function setIndicator() { report(); }
function showRestart() { END = true; report(); }
const ended = () => END;
const report = () => embedPost({ type: 'state', beat, busy, ended: END, rewinding });   // rewinding: the page waits for it to finish before showing this scene

async function advance() {
  if (busy || beat >= BEATS.length - 1) return;
  beat += 1;
  const b = BEATS[beat];
  busy = true; setIndicator(false);
  if (b.ch) setProgress(b.ch);
  if (b.run) await b.run();
  busy = false;
  setIndicator(true);
}

/** throw the scene away and build it fresh (used when going back) */
function resetScene() {
  GEN++;                                              // in-flight story chains stop at their next await
  document.getAnimations().forEach(a => { if (!(a instanceof CSSAnimation) && !(a instanceof CSSTransition)) a.cancel(); });
  [Ld, Ln, Lfx].forEach(L => { L.innerHTML = ''; });
  Object.keys(A).forEach(k => delete A[k]);
  Ln.style.clipPath = '';
  const div = $('#divider'); div.style.left = ''; div.style.opacity = '';
  const hud = $('#hud'); hud.style.transform = ''; hud.style.opacity = '';
  $('.banner-inner').style.transform = '';
  $('#hud-status').innerHTML = '';
  hudSet(12 * 60, 42);
  Camera.set(CAM.full);
  END = false;
  beat = -1; busy = false;
  buildScene(); startDayLoops(); setProgress(0);
}
/** go to the state right after beat `target` (−1 = the very start): rebuild, then fast-forward behind a quick fade */
async function rewindTo(target) {
  if (rewinding) return;
  rewinding = true;
  report();
  const fade = $('#fade');
  const fin = fade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: 'forwards' });
  await fin.finished.catch(() => {});
  fade.style.opacity = '1'; fin.cancel();
  resetScene();
  SPEED = 0.01;
  while (beat < target) await advance();
  SPEED = 1;
  fade.style.opacity = '0';
  fade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
  rewinding = false;
  setIndicator(true);                                 // reports the end of the rewind to the page
}
const back = () => rewindTo(Math.max(-1, beat - 1));

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('#stage').style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
}

async function boot() {
  Camera.el = $('#world');
  buildScene();
  $('#hud-sun').innerHTML = icon('icons/icon-sun');
  fit(); addEventListener('resize', fit);
  startDayLoops();
  setProgress(0);
  setIndicator(true);   // no title screen: the scene is live, a click anywhere starts the story
  if (VCLOCK) return director();

  const stage = $('#stage');
  const inBackZone = e => { const r = stage.getBoundingClientRect(); return (e.clientX - r.left) / r.width < 0.3; };
  stage.addEventListener('mousemove', e => stage.classList.toggle('in-back', inBackZone(e)));
  stage.addEventListener('mouseleave', () => stage.classList.remove('in-back'));
  // forward / back; at the ends an embedding page takes over (previous / next scene)
  const fwd = () => { if (ended()) { if (EMBED) embedPost({ type: 'next' }); else if (!VCLOCK) rewindTo(-1); } else advance(); };
  const bwd = () => { if (EMBED && beat < 0) embedPost({ type: 'prev' }); else back(); };
  stage.addEventListener('click', e => {
    if (rewinding || e.target.closest('#controls')) return;
    if (inBackZone(e)) { bwd(); return; }                // left side → one step back
    if (ended() && !EMBED) return;                       // the end: ↻ (top right) or a key plays it again
    fwd();
  });
  const onKey = key => {
    if (rewinding) return false;
    if (['ArrowLeft', 'Backspace', 'PageUp'].includes(key)) { bwd(); return true; }          // PageUp/Down: presentation clickers
    if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(key)) { fwd(); return true; }
    return false;
  };
  // other keys go up to the presentation page (e.g. F = full screen, N = navigation bar)
  addEventListener('keydown', e => { if (onKey(e.key)) e.preventDefault(); else if (!e.ctrlKey && !e.metaKey && !e.altKey) embedPost({ type: 'key', key: e.key }); });
  $('#btn-restart').addEventListener('click', () => { if (!rewinding) rewindTo(-1); });
  if (EMBED) {
    document.body.classList.add('embed');
    addEventListener('message', async e => {
      const m = e.data || {};
      if (!m.cop31 || rewinding || m.cmd === 'sleep' || m.cmd === 'wake') return;   // sleep / wake: engine.js, no reply (a reply would loop)
      if (m.cmd === 'rewind') await rewindTo(m.to);                       // the state right after beat m.to (−1 = start)
      else if (m.cmd === 'play') { await rewindTo(m.from - 1); advance(); }   // jump to a chapter and play it
      else if (m.cmd === 'key') onKey(m.key);
      report();
    });
    embedPost({ type: 'meta', chapters: BEATS.map((b, i) => (b.ch ? i : -1)).filter(i => i >= 0), beats: BEATS.length });
    report();
  }

  // debug: ?beat=N fast-forwards to beat N; &freeze=ms pauses everything after ms
  const q = new URLSearchParams(location.search);
  if (q.has('beat')) {
    const target = Math.min(Math.max(0, +q.get('beat') || 0), BEATS.length - 1);   // clamp, or the loop below never ends
    SPEED = 0.01;
    while (beat < target - 1) await advance();
    SPEED = 1;
    await advance();
    if (q.has('freeze')) setTimeout(() => document.getAnimations().forEach(a => a.pause()), +q.get('freeze'));
  }
}
boot();
</script>
</body>
